<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Computer</title>
<meta name="color-scheme" content="dark">
<!-- The cloud computer's screen, live. Used by the web client's Computer panel (an iframe) and the phone app (a web view).
     Token: #t=<access token> in the URL, or the parent page's Auth when embedded on the same origin.
     Watching is read-only; "Take control" asks Bridge to pass keys and pointer through (POST /api/desktop/control). -->
<style>
:root{--bg:#080a0f;--screen:#0b0d12;--bar:#0e1118;--fg:#e7ebf3;--muted:#8a93a6;--border:rgba(255,255,255,.08);--acc:#4aa8ff;--ok:#3ddc97;--warn:#ffb547;--err:#ff6b6b;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.35 var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
.wrap{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bar);border-bottom:1px solid var(--border);min-height:44px}
body.nobar .bar{display:none}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.03);font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.live .dot{background:var(--ok);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 1.8s infinite}
.ctrl .pill.state{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.ctrl .dot{background:var(--warn);animation:none;box-shadow:none}
.off .dot{background:var(--muted)}
.err .dot{background:var(--err)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.eye{width:15px;height:15px;flex:none}
.sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.05);font-weight:600}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.take{background:var(--acc);border-color:transparent;color:#04121f}
.btn.take:hover{filter:brightness(1.08)}
.btn.give{background:rgba(255,181,71,.12);border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:default}
.screen{position:relative;flex:1;min-height:0;background:var(--screen)}
#vnc{position:absolute;inset:0}
#vnc canvas{outline:none}
.ctrl .screen{box-shadow:inset 0 0 0 2px var(--warn)}
.veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--muted);background:var(--screen);z-index:2}
.veil b{color:var(--fg);font-size:14px}
.veil[hidden]{display:none}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="bar">
    <span class="pill state" id="state"><span class="dot"></span><svg class="eye" id="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="stateText">Connecting</span></span>
    <span class="sub" id="sub"></span>
    <span class="sp"></span>
    <button class="btn take" id="toggle" disabled>Take control</button>
  </div>
  <div class="screen">
    <div id="vnc"></div>
    <div class="veil" id="veil"><span class="spin"></span><b id="veilTitle">Waking the computer</b><span id="veilText">The screen appears in a second or two.</span></div>
  </div>
</div>
<script type="module">
import "/vendor/novnc-1.7.0.min.js";
const RFB = window.RFB;
const $ = (id) => document.getElementById(id);
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("bar") === "0") document.body.classList.add("nobar");
let hashToken = hash.get("t") || "";
if (hashToken) history.replaceState(null, "", location.pathname + location.search);   // keep the token out of history
/** the freshest token: the embedding Bridge page refreshes its own; a web view has the one it was opened with */
function token() {
  try { const t = window.parent !== window && window.parent.Auth && window.parent.Auth.token; if (t) return t; } catch (e) {}
  return hashToken;
}
const api = (path, body) => fetch(path, { method: body ? "POST" : "GET", headers: { "content-type": "application/json", ...(token() ? { authorization: "Bearer " + token() } : {}) }, body: body ? JSON.stringify(body) : undefined })
  .then(async (r) => ({ ok: r.ok, status: r.status, j: await r.json().catch(() => ({})) }));

let rfb = null, control = false, connected = false, retry = 0, viewers = 0, gone = false;
function tell(state) { try { window.parent !== window && window.parent.postMessage({ type: "bridge-desktop", state, control, viewers }, location.origin); } catch (e) {} }
function paint(mode, text) {
  const w = $("wrap");
  w.className = "wrap " + mode;
  $("stateText").textContent = text;
  $("eye").style.display = mode === "live" ? "" : "none";
  const b = $("toggle");
  b.disabled = !connected;
  b.textContent = control ? "Give back" : "Take control";
  b.className = "btn " + (control ? "give" : "take");
  $("sub").textContent = connected ? (control ? "Your keys and clicks reach the computer. The agent waits." : viewers > 1 ? viewers + " watching · read-only" : "Read-only. The agent is driving.") : "";
  tell(mode);
}
function veil(on, title, text, spinning = true) {
  $("veil").hidden = !on;
  if (title) $("veilTitle").textContent = title;
  if (text != null) $("veilText").textContent = text;
  $("veil").querySelector(".spin").style.display = spinning ? "" : "none";
}
function wsUrl() { return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/desktop/ws?access_token=" + encodeURIComponent(token()); }

function connect() {
  if (gone) return;
  paint("off", "Connecting");
  veil(true, "Waking the computer", "The screen appears in a second or two.");
  rfb = new RFB($("vnc"), wsUrl(), { shared: true });
  rfb.viewOnly = !control;
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  rfb.background = "#0b0d12";
  rfb.addEventListener("connect", () => { connected = true; retry = 0; veil(false); sync(); });
  rfb.addEventListener("disconnect", (e) => {
    connected = false; rfb = null;
    if (gone) return;
    const n = Math.min(10, 1 + retry++);
    paint("err", "Reconnecting");
    veil(true, "The screen dropped", "Trying again in " + n + "s.", false);
    setTimeout(probeThenConnect, n * 1000);
  });
}
/** the WebSocket hides why it failed: ask the status route, which says no screen / signed out / asleep */
async function probeThenConnect() {
  const r = await api("/api/desktop/status").catch(() => null);
  if (r && r.status === 401) { paint("err", "Signed out"); veil(true, "Sign in again", "Your Bridge session ended. Reopen this panel after signing in.", false); return; }
  if (r && r.ok && r.j.available === false) { paint("off", "No screen"); veil(true, "This computer has no screen", "The Computer panel works on the cloud computer.", false); return; }
  connect();
}
async function sync() {
  const r = await api("/api/desktop/status").catch(() => null);
  if (r && r.ok) { viewers = r.j.viewers || 0; setControl(!!r.j.control, false); }
  if (connected) paint(control ? "ctrl" : "live", control ? "You're in control" : "Viewing");
}
function setControl(on, sendIt = true) {
  control = on;
  if (rfb) { rfb.viewOnly = !on; if (on) rfb.focus(); }
  if (sendIt) api("/api/desktop/control", { on }).then((r) => { if (r.ok) { viewers = r.j.viewers || viewers; control = !!r.j.control; if (rfb) rfb.viewOnly = !control; } sync(); });
  if (connected) paint(on ? "ctrl" : "live", on ? "You're in control" : "Viewing");
}
$("toggle").addEventListener("click", () => setControl(!control));
// the parent (web panel / phone app) can toggle and ask for state
window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || !e.data || e.data.type !== "bridge-desktop-cmd") return;
  if (e.data.control !== undefined) setControl(!!e.data.control);
});
window.BridgeDesktop = { setControl, state: () => ({ connected, control, viewers }) };
// leaving hands the screen back on its own: Bridge returns control to the agent when the last viewer disconnects
addEventListener("pagehide", () => { gone = true; try { rfb && rfb.disconnect(); } catch (e) {} });
setInterval(() => { if (connected) sync(); }, 3000);
probeThenConnect();
</script>
</body>
</html>
