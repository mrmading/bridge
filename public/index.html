<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bridge">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Bridge</title>
<meta name="color-scheme" content="dark light">
<script>/* one-time: dark became the default, clear any stale pre-v2 choice */
if(!localStorage.bridgeThemeV2){delete localStorage.bridgeTheme;localStorage.bridgeThemeV2="1"}
document.documentElement.dataset.theme=localStorage.bridgeTheme||"dark"</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23000'/><rect x='0.5' y='0.5' width='31' height='31' rx='7.5' fill='none' stroke='%234aa8ff' stroke-opacity='.55'/><text x='16' y='23' font-size='18' font-family='Orbitron,Menlo,monospace' font-weight='900' fill='%237fd0ff' text-anchor='middle'>B</text></svg>">
</head>
<body>
<div class="light" id="light"></div>
<div id="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="top" id="top"></header>
    <div id="viewHost" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal"></div>
<div class="palette" id="palette"><input id="palIn" placeholder="Search chats, projects, files, agents, skills…" spellcheck="false" autocomplete="off"><div class="res" id="palRes"></div></div>

<div class="finder" id="finder">
  <div class="finder-head">
    <div class="finder-bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="finderIn" placeholder="Describe it: “the zeroship cloudflare deploy”, “padel occupancy excel”…" spellcheck="false" autocomplete="off">
      <span class="spin-s" id="finderSpin" style="display:none"></span>
      <button class="pill" id="finderClose">Esc</button></div>
    <div class="finder-scope">
      <div class="seg" style="margin:0"><button class="on" data-scope="folder" id="segFolder">This folder</button><button data-scope="all">Everything</button></div>
      <span class="finder-note" id="finderNote">Bridge reads every transcript, not just titles.</span>
    </div>
  </div>
  <div class="finder-body" id="finderBody"></div>
</div>

<div class="sheet-bg" id="signinBg"><div class="sheet">
  <div class="sheet-head"><span id="signinTitle">Sign in to Claude Code</span><span style="flex:1"></span><button class="icon-btn" id="signinClose" title="Close">✕</button></div>
  <div class="sheet-body" id="signinBody"></div>
</div></div>

<div class="voice" id="voice">
  <div class="vtop">
    <span class="vstate" id="vstate"><span class="dot"></span><span class="t">starting</span></span>
    <span style="flex:1"></span>
    <button class="pill" id="vMute" title="Speak answers aloud">Voice on</button>
    <button class="pill" id="vFeedBtn" title="Show the conversation">Conversation</button>
  </div>
  <canvas id="vorb" width="560" height="560" title="Tap to talk"></canvas>
  <div class="vlabel" id="vlabel"></div>
  <div class="cap" id="vcap"></div>
  <div class="ctrls">
    <button class="rbtn" title="Type instead" id="vKeys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
    <button class="rbtn" title="Talk (hold Space)" id="vMic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="rbtn end" title="End voice (Esc)" id="vEnd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="pill on" id="vHands">Hands-free on</button>
  </div>
  <div class="vfeed" id="vfeed"><div class="vf-b" id="vfeedBody"></div>
    <div class="vf-in"><input id="vInput" placeholder="Ask about everything that is going on…" spellcheck="false" autocomplete="off"><button class="send" id="vSend" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div></div>
</div>
<input type="file" id="fileInput" multiple hidden>
<div class="toast" id="toasts"></div>
<div id="grain"></div>
<script src="/app.js"></script>
<script src="/views.js"></script>
<script src="/voice.js"></script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script>
</body>
</html>
