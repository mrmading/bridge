<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bridge sign-in</title>
<meta name="color-scheme" content="dark light">
<style>
  :root{--bg:#080a0f;--fg:#e8ecf3;--muted:#8a93a6;--card:#11141c;--border:#232838;--ok:#3ecf8e;--err:#ff6b6b;--accent:#4aa8ff}
  @media (prefers-color-scheme: light){:root{--bg:#f6f7fb;--fg:#11141c;--muted:#5b6476;--card:#fff;--border:#e2e5ee}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px;box-sizing:border-box}
  .card{max-width:440px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px}
  h1{font-size:19px;margin:0 0 8px} p{color:var(--muted);margin:0 0 12px}
  .ok{color:var(--ok)} .err{color:var(--err)}
  textarea{width:100%;box-sizing:border-box;height:84px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--fg);font:12px ui-monospace,Menlo,monospace;padding:8px}
  button{margin-top:10px;height:34px;padding:0 14px;border-radius:9px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="card" id="box"><h1>Finishing sign-in…</h1><p>One moment.</p></div>
<script>
/* The vendor sends the user back here with ?code&state. The Bridge tab that opened this window
 * finishes the sign-in with its own session; with no opener, this page tries with the Bridge
 * session in this browser; failing both, it shows the address to paste into Bridge. */
(function () {
  const box = document.getElementById("box");
  const q = new URLSearchParams(location.search);
  const e = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const done = (name) => { box.innerHTML = '<h1 class="ok">Connected' + (name ? " to " + e(name) : "") + "</h1><p>Bridge picks it up on its own. You can close this tab.</p>"; setTimeout(() => { try { window.close(); } catch (x) {} }, 1500); };
  const paste = (why) => {
    box.innerHTML = "<h1>Almost there</h1><p>" + e(why) + " Copy this address and paste it into Bridge › Connectors › Sign in.</p>" +
      '<textarea id="u" readonly>' + e(location.href) + '</textarea><button id="cp">Copy address</button>';
    document.getElementById("cp").onclick = () => { navigator.clipboard.writeText(location.href); document.getElementById("cp").textContent = "Copied"; };
  };
  if (q.get("error")) { box.innerHTML = '<h1 class="err">Sign-in was not completed</h1><p>' + e(q.get("error_description") || q.get("error")) + "</p>"; return; }
  if (!q.get("code") || !q.get("state")) { box.innerHTML = '<h1 class="err">Nothing to finish</h1><p>This page has no sign-in code.</p>'; return; }

  // finishing needs only the vendor's code and the single-use state, so no Bridge session is needed here
  async function selfFinish() {
    try {
      const r = await fetch("/api/connectors/oauth/finish", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code: q.get("code"), state: q.get("state") }) });
      const j = await r.json();
      if (j.error) return paste(j.error + ".");
      done(j.connector && j.connector.name);
    } catch (x) { paste("Bridge could not be reached from here."); }
  }

  if (window.opener) {
    let answered = false;
    addEventListener("message", (ev) => {
      if (ev.origin !== location.origin || !ev.data || !ev.data.bridgeOAuthDone) return;
      answered = true;
      if (ev.data.error) paste(ev.data.error + "."); else done(ev.data.name);
    });
    try { window.opener.postMessage({ bridgeOAuth: location.href }, location.origin); } catch (x) {}
    setTimeout(() => { if (!answered) selfFinish(); }, 4000);
  } else selfFinish();
})();
</script>
</body>
</html>
